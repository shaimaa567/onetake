function drawFit(c,im,x,y,w,h,r){ c.save(); c.beginPath(); c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath(); c.clip();
  const s=Math.max(w/im.width,h/im.height), iw=im.width*s, ih=im.height*s; c.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih); c.restore(); }

const LOGO_W=885, LOGO_H=315;

// text: words land (RTL, first word on the right), then leave upward together
function words(t,ws,size,cx,cy,t0,t1,color,stagger=0.09,weight=500){
  if(t<t0-0.01||t>t1+0.5) return;
  ctx.save(); ctx.font=`${weight} ${size}px Tajawal`; ctx.direction='rtl'; ctx.textAlign='center';
  const wz=ws.map(w=>ctx.measureText(w).width), sp=size*0.3, total=wz.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  const fit=Math.min(1,960/total), out=sstep(t1,t1+0.3,t); let x=cx+total*fit/2;
  ws.forEach((w,i)=>{ x-=wz[i]*fit/2; const r=OM.wordRise(t,t0+i*stagger,{dist:34});
    ctx.globalAlpha=r.op*(1-out); ctx.fillStyle=Array.isArray(color)?color[i]:color;
    ctx.save(); ctx.translate(x,cy+r.y-out*34); ctx.scale(r.s*fit,r.s*fit); ctx.fillText(w,0,0); ctx.restore(); x-=wz[i]*fit/2+sp*fit; });
  ctx.restore();
}
// a slot that rolls vertically through a list (the reference's «آلة الحظ», with our own words)
function roll(t,list,t0,step,dur,cx,cy,size,fadeT0,fadeT1,color,hot){
  let p=0; for(let k=1;k<list.length;k++) p+=ease.expoOut(seg(t,t0+(k-1)*step,t0+(k-1)*step+dur));
  const a=sstep(t0-0.25,t0,t)*(1-sstep(fadeT0,fadeT1,t)); if(a<=0.01) return;
  ctx.save(); ctx.font=`500 ${size}px Tajawal`; ctx.direction='rtl'; ctx.textAlign='center';
  list.forEach((w,i)=>{ const d=i-p, ad=Math.abs(d); if(ad>1.7) return; const wd=ctx.measureText(w).width, fit=Math.min(1,900/wd);
    ctx.save(); ctx.globalAlpha=a*clamp(1-ad*0.8,0,1)**1.3; ctx.filter=ad>0.12?`blur(${(ad*7*DPR).toFixed(1)}px)`:'none';
    ctx.fillStyle=(i===list.length-1&&ad<0.5)?hot:color; ctx.translate(cx,cy+d*size*1.25-(1-a)*20); ctx.scale(fit*(1-0.1*ad),fit*(1-0.1*ad)); ctx.fillText(w,0,0); ctx.restore(); });
  ctx.restore();
}

  g.direction='rtl'; g.textAlign='center';

    if(logo.complete&&logo.naturalWidth){ const lw=400, lh=lw*LOGO_H/LOGO_W; g.drawImage(logo,282-lw/2,350-lh/2,lw,lh); g.strokeStyle=BURG; g.lineWidth=7; g.lineCap='round'; g.beginPath(); const o=[282-lw/2-0,350-lh/2]; const sc=lw/LOGO_W; g.moveTo(o[0]+(400-60)*sc,o[1]+(497-225)*sc); for(const [x,y] of [[460,488],[520,480],[580,474.5],[640,469.5],[700,465.5],[760,462.5],[820,459.5],[880,458.5],[915,458.5]]) g.lineTo(o[0]+(x-60)*sc,o[1]+(y-225)*sc); g.stroke(); }
    g.fillStyle='rgba(22,18,17,0.14)'; g.fillRect(150,150,260,2); g.fillRect(150,590,260,2);

    for(const [n,iw,ih,bg,fg,tx] of defs){ const w=Math.round(H0*iw/ih), d=46; BOOKS[n]={w,h:H0,d,cover:imgBook(n,w,H0),spine:makeSpine(d,H0,bg,fg,tx,24)}; if(n==='roma') BOOKS[n].pages=0; } PAGESC=makePages(66,740); BOOKS.pagesSmall=makePages(46,H0); PCARDS.push(...['s1','s2','s3','s4','s5'].map((n,i)=>makePolaroid(n,i%2===0))); } return seek(0); })();
window.__track=t=>{ const o={}; if(t>=6.55&&t<T.cut){ const b=BOOKP(t); o.book={x:b.x-260*b.zoom,y:b.y-370*b.zoom,w:520*b.zoom,h:740*b.zoom,op:1}; }
  if(t>=T.cut&&t<T.fill) o.pill={x:PILL.x-PILL.w/2,y:PILL.y-PILL.h/2,w:PILL.w,h:PILL.h,op:1}; return o; };
window.__motion=(a,b)=>{ let m=0; if(a>=6.5&&b<=T.cut){ const p=BOOKP(a),q=BOOKP(b); m=Math.max(m,Math.hypot(p.x-q.x,p.y-q.y),Math.abs(p.zoom-q.zoom)*300); }
  if(a>=9&&b<=11.8) m=Math.max(m,Math.hypot(340*(Math.cos(a*1.1)-Math.cos(b*1.1)),230*(Math.sin(a*1.1)-Math.sin(b*1.1)))); if(a>=11.3&&b<=12.8) m=Math.max(m,Math.abs(1500*(spring(a-11.4,0.82,9)-spring(b-11.4,0.82,9))));
  if(a>=T.fill-0.05&&b<=T.fill+0.7) m=Math.max(m,1200*Math.abs(ease.expoInOut(seg(a,T.fill,T.fill+0.6))-ease.expoInOut(seg(b,T.fill,T.fill+0.6)))); return m; };
const q=new URLSearchParams(location.search);
if(q.has('t')) __ready.then(()=>seek(parseFloat(q.get('t'))));
if(q.has('hud')) document.getElementById('hud').style.display='block';
if(q.has('play')) __ready.then(()=>{const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();});
