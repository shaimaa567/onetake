<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Ms. Memories · 30s</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Ms. Memories — a 30 s, 9:16 digital-illustration film. Every picture is drawn (art.js); every value is a function of t.
   Palette: burgundy, ivory, soft gold. Type: Reem Kufi (Arabic lines), Cormorant Garamond italic (the wordmark). */
:root{ --wine0:#22050f; --wine1:#3f0b1c; --wine2:#5e1229; --wine3:#7f1d38; --ivory:#fff3df; --gold1:#c99a4b; --gold2:#e9c982; --gold3:#fbeabf; }
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--wine0)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--wine0)}
canvas{display:block}
#bg,#fx{position:absolute;left:0;top:0;width:1080px;height:1920px}
#fx{pointer-events:none}
#persp{position:absolute;inset:0;perspective:2100px;perspective-origin:540px 780px}
#world{position:absolute;left:540px;top:780px;width:0;height:0;transform-style:preserve-3d}
.o{position:absolute;transform-style:preserve-3d}
.f{position:absolute;left:0;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sh{position:absolute;inset:0;background:#2a0612;opacity:0;pointer-events:none}
/* text */
#txt{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.tb{position:absolute;left:90px;width:900px;top:1330px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;will-change:transform,opacity}
.tb .ln{direction:rtl;text-align:center;font-family:RK,'Reem Kufi',sans-serif;font-weight:600;font-size:74px;line-height:1.62;color:var(--ivory);text-shadow:0 3px 28px rgba(26,2,10,.75),0 0 2px rgba(26,2,10,.5);text-wrap:balance}
.tb .w{display:inline-block;will-change:transform,opacity;margin:0 .13em;white-space:nowrap}
.tb .w.h{color:var(--gold2);text-shadow:0 0 34px rgba(233,201,130,.55),0 3px 24px rgba(26,2,10,.7)}
.tb .orn{margin-top:14px;height:3px;width:260px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);transform-origin:50% 50%}
#logo{position:absolute;left:0;width:1080px;top:1320px;text-align:center;will-change:transform,opacity}
#logo .m{display:inline-block;font-family:CG,'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:176px;line-height:1.1;letter-spacing:.005em;direction:ltr;
  background:linear-gradient(100deg,#9a6a26 0%,#fbeabf 22%,#c99a4b 44%,#fbeabf 62%,#9a6a26 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 26px rgba(20,0,8,.6))}
#logo .o2{margin:6px auto 0;height:3px;width:420px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="persp"><div id="world"></div></div>
  <div id="txt"></div>
  <div id="logo"><div class="m">Ms. Memories</div><div class="o2"></div></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
</div>
<script src="motion.js"></script>
<script src="art.js"></script>
<script>
'use strict';
const {clamp, lerp, sstep, spring: spr, ease, rng} = OM;
const DUR = 30, seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const world = document.getElementById('world');
window.__meta = {dur: DUR, fps: 30};

/* ───────────────────────────── helpers ───────────────────────────── */
function mk(parent, cls, w, h, css) { const e = document.createElement('div'); e.className = cls; e.style.cssText = `left:0;top:0;width:${w}px;height:${h}px;margin-left:${-w / 2}px;margin-top:${-h / 2}px;` + (css || ''); parent.appendChild(e); return e; }
function cv(w, h, scale) { const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale); c.style.cssText = `width:${w}px;height:${h}px;`; return c; }
function pose(e, p) {
  e.style.transform = `translate3d(${p.x || 0}px,${p.y || 0}px,${p.z || 0}px) rotateZ(${p.rz || 0}deg) rotateY(${p.ry || 0}deg) rotateX(${p.rx || 0}deg) scale(${p.s == null ? 1 : p.s})`;
  e.style.opacity = p.op == null ? 1 : p.op; e.style.display = (p.op != null && p.op <= 0.003) || p.hide ? 'none' : 'block';
}
function rotv(v, rx, ry, rz) {
  const d = Math.PI / 180; let [x, y, z] = v, c = Math.cos(rx * d), s = Math.sin(rx * d); [y, z] = [y * c - z * s, y * s + z * c];
  c = Math.cos(ry * d); s = Math.sin(ry * d); [x, z] = [x * c + z * s, -x * s + z * c];
  c = Math.cos(rz * d); s = Math.sin(rz * d); [x, y] = [x * c - y * s, x * s + y * c]; return [x, y, z];
}
const mix = (a, b, k) => a + (b - a) * k;
const mixP = (A, B, k) => ({x: mix(A.x, B.x, k), y: mix(A.y, B.y, k), z: mix(A.z, B.z, k), rx: mix(A.rx, B.rx, k), ry: mix(A.ry, B.ry, k), rz: mix(A.rz, B.rz, k), s: mix(A.s, B.s, k)});
function keyed(t, K) {                                   // K: [[t, v, curve?] …] — the curve belongs to the leg that ENDS at the key
  if (t <= K[0][0]) return K[0][1]; for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const u = (t - K[i - 1][0]) / (K[i][0] - K[i - 1][0]); return mix(K[i - 1][1], K[i][1], (K[i][2] || ease.smooth)(u)); } return K[K.length - 1][1];
}

/* ───────────────────────────── timeline (seconds) ───────────────────────────── */
const T = {
  phoneIn: 0.15, lift: 4.95, phoneOut: 5.1, converge: 7.0, bookIn: 7.35, openStart: 9.9, openEnd: 11.5,
  flips: [11.55, 12.6, 13.6, 14.5], flipDur: 0.9,
  phone2In: 15.55, lock: 17.75, scan0: 18.2, scan1: 19.6, success: 19.85, hero: 20.5, phone2Out: 22.3,
  unflip: [22.55, 22.7, 22.85, 23.0], unflipDur: 0.62, coverClose: 23.55, coverCloseEnd: 24.55,
};
const TEXT = [
  {id: 1, t0: 0.9, t1: 4.55, words: ['كم', 'ذكرى', 'حلوة', 'عايشة', 'في', 'تلفونك؟'], hi: [1]},
  {id: 2, t0: 5.55, t1: 9.2, words: ['تخيّل', 'كل', 'هالذكريات', 'تجتمع', 'في', 'كتاب', 'واحد!'], hi: [5]},
  {id: 3, t0: 10.75, t1: 15.7, words: ['مو', 'مجرد', 'ألبوم', 'صور…', 'كتاب', 'يحكي', 'قصتكم.'], hi: [4, 6]},
  {id: 4, t0: 16.9, t1: 22.35, words: ['امسحوا', 'الرمز…', 'وعيشوا', 'اللحظة', 'من', 'جديد.'], hi: [3]},
  {id: 5, t0: 23.35, t1: 26.85, words: ['الذكريات', 'حكايات', 'تستحق', 'أن', 'تبقى.'], hi: [1]},
];
const LOGO_T = 27.15;

/* sound cues — score.py reads these through window.__events(); x is the screen side −1…1 */
const EVENTS = [];
const ev = (t, kind, v = 1, pan = 0) => EVENTS.push({t, kind, v, pan});
ev(0.2, 'swell', 1); ev(0.55, 'whoosh', .7, 0); for (let i = 0; i < 12; i++) ev(0.7 + i * 0.1, 'pop', .55, (i % 3 - 1) * .5);
ev(T.lift, 'shimmer', .9); ev(T.lift + 0.05, 'whoosh', .8, 0); ev(T.converge + 0.2, 'whoosh', .7, 0);
for (let i = 0; i < 12; i++) ev(T.converge + 0.85 + i * 0.1, 'absorb', .5 + i * .03, (i % 5 - 2) * .25);
ev(T.bookIn + 1.9, 'thump', .9); ev(T.bookIn + 1.9, 'shimmer', .8);
ev(T.openStart + 0.05, 'cover', 1); ev(T.openEnd - 0.2, 'thump', .55);
T.flips.forEach((f, i) => ev(f + 0.1, 'flip', .8, -0.3 + i * .12));
ev(T.phone2In + 0.05, 'whoosh', .8, .5); ev(T.lock, 'lock', .7); ev(T.scan0, 'scan', .6); ev(T.scan0 + 0.7, 'scan', .6);
ev(T.success, 'success', 1); ev(T.hero, 'whoosh', .7, 0); ev(T.hero + 0.25, 'shimmer', .6);
ev(T.phone2Out, 'whoosh', .7, 0);
T.unflip.forEach((f, i) => ev(f + 0.05, 'flip', .75, .3 - i * .1));
ev(T.coverClose + 0.55, 'close', 1); ev(T.coverCloseEnd, 'shimmer', .9);
ev(LOGO_T, 'logo', 1);
window.__events = () => ({T: DUR, events: EVENTS});

/* ───────────────────────────── scene objects ───────────────────────────── */
const PH_W = 440, PH_H = 900;
const SLOT = (() => {                                     // slot centres in the phone's own frame
  const cols = 3, gap = 10, side = 14, cw = (400 - 2 * side - 2 * gap) / cols, ch = cw * 4 / 3, out = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < cols; c++) out.push({x: -200 + side + cw * (c + .5) + gap * c, y: -280 + ch * (r + .5) + gap * r, w: cw, h: ch});
  return out;
})();
const PHOTO_IDS = [0, 3, 1, 4, 2, 6, 5, 7, 8, 9, 10, 11];

function drawPhoneBase(c, scale, screenDraw) {                 // the phone body, drawn flat; the screen is a callback
  c.save(); c.scale(scale, scale);
  const A = ART;
  c.fillStyle = A.lg(c, 0, 0, 0, PH_H, [[0, '#d9b36a'], [0.5, '#8a5a1e'], [1, '#e9c982']]); A.rr(c, 0, 0, PH_W, PH_H, 74); c.fill();               // gold rim
  c.fillStyle = A.lg(c, 0, 0, PH_W, PH_H, [[0, '#2c0c17'], [1, '#12030a']]); A.rr(c, 6, 6, PH_W - 12, PH_H - 12, 68); c.fill();                 // bezel
  c.save(); A.rr(c, 20, 20, 400, 860, 56); c.clip(); c.translate(20, 20); screenDraw(c); c.restore();
  c.fillStyle = '#0a0207'; A.rr(c, PH_W / 2 - 58, 34, 116, 32, 16); c.fill(); c.fillStyle = '#1d0c14'; c.beginPath(); c.arc(PH_W / 2 + 36, 50, 7, 0, Math.PI * 2); c.fill();
  c.restore();
}
function gallerySkin(c) {                                  // inside a 400×860 screen
  const A = ART; c.fillStyle = A.lg(c, 0, 0, 0, 860, [[0, '#4a0f22'], [1, '#2a0713']]); c.fillRect(0, 0, 400, 860);
  c.fillStyle = A.lg(c, 0, 0, 400, 0, [[0, 'rgba(255,200,170,.08)'], [1, 'rgba(255,200,170,0)']]); c.fillRect(0, 0, 400, 860);
  c.fillStyle = '#fff3df'; c.font = '600 22px RK, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillText('9:41', 38, 36);
  c.fillStyle = '#fff3df'; A.rr(c, 330, 29, 34, 15, 4); c.globalAlpha = .9; c.fill(); c.globalAlpha = 1; A.rr(c, 365, 33, 3, 7, 1.5); c.fill();
  c.textAlign = 'right'; c.fillStyle = A.P.g2; c.font = '600 38px RK, sans-serif'; c.direction = 'rtl'; c.fillText('٣٬٤١٢', 380, 112);       // 3,412 — the size of a camera roll
  c.direction = 'ltr'; c.strokeStyle = A.P.g2; c.lineWidth = 3; A.rr(c, 24, 90, 40, 32, 7); c.stroke(); c.beginPath(); c.moveTo(30, 116); c.lineTo(41, 102); c.lineTo(48, 110); c.lineTo(54, 104); c.lineTo(60, 116); c.stroke(); c.fillStyle = A.P.g2; c.beginPath(); c.arc(52, 98, 3, 0, 7); c.fill();
  SLOT.forEach(s => { c.fillStyle = 'rgba(10,2,6,.55)'; A.rr(c, 200 + s.x - s.w / 2, 430 + s.y - s.h / 2, s.w, s.h, 8); c.fill(); });
  c.fillStyle = 'rgba(10,2,6,.5)'; c.fillRect(0, 806, 400, 54);
  for (let i = 0; i < 4; i++) { c.strokeStyle = i === 0 ? A.P.g2 : 'rgba(251,234,191,.45)'; c.lineWidth = 3; A.rr(c, 52 + i * 84, 822, 28, 22, 6); c.stroke(); }
}

/* phone 1 ─ the camera roll */
const phone1 = mk(world, 'o', PH_W, PH_H);
(() => {
  for (let i = 5; i >= 1; i--) { const l = mk(phone1, 'o', PH_W - 2, PH_H - 2, `left:50%;top:50%;border-radius:72px;background:${i % 2 ? '#7a4f1b' : '#b88a3e'};transform:translateZ(${-i * 2}px)`); }
  const base = cv(PH_W, PH_H, 1.5); phone1.appendChild(base); base.className = 'f'; base.style.backfaceVisibility = 'visible';
  window.__phone1Canvas = base;
})();
/* phone 2 ─ the scanner */
const phone2 = mk(world, 'o', PH_W, PH_H);
const p2base = cv(PH_W, PH_H, 1.5), p2skin = cv(400, 860, 1.5);
(() => {
  for (let i = 5; i >= 1; i--) mk(phone2, 'o', PH_W - 2, PH_H - 2, `left:50%;top:50%;border-radius:72px;background:${i % 2 ? '#7a4f1b' : '#b88a3e'};transform:translateZ(${-i * 2}px)`);
  p2base.className = 'f'; p2base.style.backfaceVisibility = 'visible'; phone2.appendChild(p2base);
  p2skin.style.cssText += 'position:absolute;left:20px;top:20px;border-radius:56px;transform:translateZ(.5px)'; phone2.appendChild(p2skin);
  const gl = mk(phone2, 'o', 400, 860, 'left:50%;top:50%;border-radius:56px;background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,235,200,.1) 100%);transform:translateZ(1px);pointer-events:none');
})();

/* photos ─ twelve prints that live on the phone, then in the air, then in the book */
const photos = PHOTO_IDS.map((id, i) => {
  const e = mk(world, 'o', 236, 314), c = cv(236, 314, 1.5); e.appendChild(c); ART.drawPhoto(c, id, {w: c.width, h: c.height});
  const fr = document.createElement('div'); fr.style.cssText = 'position:absolute;left:-13px;top:-13px;right:-13px;bottom:-34px;background:#fffaf0;opacity:0;z-index:-1;box-shadow:0 18px 50px rgba(20,0,8,.55);transform:translateZ(-1px)'; e.appendChild(fr);
  const gl = document.createElement('div'); gl.style.cssText = 'position:absolute;left:-60px;top:-60px;right:-60px;bottom:-60px;background:radial-gradient(closest-side,rgba(251,234,191,.55),rgba(251,234,191,0));opacity:0;transform:translateZ(-2px)'; e.appendChild(gl);
  return {e, fr, gl, i};
});

/* book ─ spine axis at the origin of `inner`; the closed book is centred by shifting inner right by half a page */
const PW = 470, PHT = 640, N = 5, NS = 3, SW = PW / NS, SC = 1.5;
const glowBack = mk(world, 'o', 1500, 1500, 'background:radial-gradient(closest-side,rgba(233,201,130,.42),rgba(233,201,130,.12) 55%,rgba(233,201,130,0));');
const shadowBack = mk(world, 'o', 1300, 1300, 'background:radial-gradient(closest-side,rgba(10,0,4,.55),rgba(10,0,4,0));');
const bookRoot = mk(world, 'o', 0, 0), inner = mk(bookRoot, 'o', 0, 0);
const spineP = mk(inner, 'o', 10, PHT, 'background:linear-gradient(90deg,#4a0d1f,#8a2a44 40%,#4a0d1f);');
const foreP = mk(inner, 'o', 10, PHT, 'background:repeating-linear-gradient(90deg,#f5e6c8 0 2px,#d9c196 2px 3px);');
const topP = mk(inner, 'o', PW, 10, 'background:repeating-linear-gradient(0deg,#f5e6c8 0 2px,#d9c196 2px 3px);');
const botP = mk(inner, 'o', PW, 10, 'background:repeating-linear-gradient(0deg,#f5e6c8 0 2px,#d9c196 2px 3px);');
const backCover = mk(inner, 'o', PW, PHT, 'background:linear-gradient(120deg,#6e1630,#3f0b1c);border-radius:6px');
const leaves = [];
const FACE = [['L0f', 'L0b'], ['L1f', 'L1b'], ['L2f', 'L2b'], ['L3f', 'L3b'], ['L4f', 'L4b']];
function strips(face, key, side) {                        // a face → NS canvases sliced from one page drawing
  const src = cv(PW, PHT, SC); ART.drawPage(src, key); return src;
}
const pageSrc = {}; FACE.flat().forEach(k => { pageSrc[k] = strips(null, k); });
const cover = mk(inner, 'o', PW, PHT), coverFront = document.createElement('canvas'), coverBack = document.createElement('canvas');
(() => {
  cover.style.marginLeft = -PW + 'px'; cover.style.marginTop = -PHT / 2 + 'px'; cover.style.left = '0'; cover.style.transformOrigin = '100% 50%';
  coverFront.width = PW * 2; coverFront.height = PHT * 2; coverBack.width = PW * SC; coverBack.height = PHT * SC; [coverFront, coverBack].forEach(c => { c.style.cssText = `width:${PW}px;height:${PHT}px;`; });
})();
function buildLeaf(i) {
  const L = mk(inner, 'o', PW, PHT); L.style.marginLeft = -PW + 'px'; L.style.marginTop = -PHT / 2 + 'px'; L.style.left = '0'; L.style.transformOrigin = '100% 50%';
  const ss = []; let parent = L;
  for (let j = 0; j < NS; j++) {
    const S = document.createElement('div'); S.className = 'o'; S.style.cssText = `width:${SW + 1.2}px;height:${PHT}px;top:0;transform-origin:100% 50%;`;
    S.style.left = j === 0 ? (PW - SW - 1.2 + 1.2) + 'px' : (-SW) + 'px'; if (j === 0) S.style.left = (PW - SW - 1.2) + 'px';
    parent.appendChild(S); parent = S;
    const mkFace = (src, sx, back) => { const c = document.createElement('canvas'); c.width = Math.round((SW + 1.2) * SC); c.height = Math.round(PHT * SC); c.style.cssText = `width:${SW + 1.2}px;height:${PHT}px;`; c.getContext('2d').drawImage(src, sx * SC, 0, (SW + 1.2) * SC, PHT * SC, 0, 0, c.width, c.height); const d = document.createElement('div'); d.className = 'f'; d.style.cssText = `width:${SW + 1.2}px;height:${PHT}px;` + (back ? 'transform:rotateY(180deg);' : ''); d.appendChild(c); const sh = document.createElement('div'); sh.className = 'sh'; d.appendChild(sh); S.appendChild(d); return sh; };
    const fsx = PW - (j + 1) * SW - 1.2 * (j === NS - 1 ? 0 : 0) , bsx = j * SW;
    const fs = mkFace(pageSrc[FACE[i][0]], Math.max(0, PW - (j + 1) * SW - (j === 0 ? 0 : 0) - 0.0), false);
    const bs = mkFace(pageSrc[FACE[i][1]], Math.min(PW - SW - 1.2, bsx), true);
    ss.push({S, fs, bs});
  }
  leaves.push({L, ss});
}
for (let i = 0; i < N; i++) buildLeaf(i);
const sweep = document.createElement('div'); sweep.style.cssText = 'position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,240,200,0) 40%,rgba(255,240,200,.45) 50%,rgba(255,240,200,0) 60%);background-size:300% 100%;background-position:150% 0;mix-blend-mode:screen';
const pulse = document.createElement('div'); pulse.style.cssText = 'position:absolute;inset:0;background:radial-gradient(closest-side,rgba(251,234,191,.95),rgba(251,234,191,0));opacity:0;mix-blend-mode:screen';
const cfShade = document.createElement('div'); cfShade.className = 'sh'; const cbShade = document.createElement('div'); cbShade.className = 'sh';
(() => {
  const f = document.createElement('div'); f.className = 'f'; f.style.cssText = `width:${PW}px;height:${PHT}px`; f.appendChild(coverFront); f.appendChild(sweep); f.appendChild(pulse); f.appendChild(cfShade); cover.appendChild(f);
  const b = document.createElement('div'); b.className = 'f'; b.style.cssText = `width:${PW}px;height:${PHT}px;transform:rotateY(180deg)`; b.appendChild(coverBack); b.appendChild(cbShade); cover.appendChild(b);
})();
// QR page furniture — brackets, a scan line and a lock ring ride on the page itself (child of leaf 4's container)
const qrFx = mk(inner, 'o', PW, PHT, 'left:0;');
qrFx.style.marginLeft = -PW + 'px'; qrFx.style.marginTop = -PHT / 2 + 'px';
const QR = {x: 112, y: 180, s: 246};
const brackets = document.createElement('div'); brackets.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%';
['tl', 'tr', 'bl', 'br'].forEach(k => { const b = document.createElement('div'); b.style.cssText = `position:absolute;width:44px;height:44px;border:6px solid #e9c982;border-radius:10px;filter:drop-shadow(0 0 8px rgba(233,201,130,.9));` + (k[0] === 't' ? 'border-bottom:none;' : 'border-top:none;') + (k[1] === 'l' ? 'border-right:none;' : 'border-left:none;'); b.dataset.k = k; brackets.appendChild(b); });
const scanLine = document.createElement('div'); scanLine.style.cssText = `position:absolute;left:${QR.x - 8}px;width:${QR.s + 16}px;height:34px;background:linear-gradient(180deg,rgba(251,234,191,0),rgba(251,234,191,.85) 70%,rgba(251,234,191,0));box-shadow:0 0 30px rgba(233,201,130,.9);border-bottom:3px solid #fbeabf;opacity:0`;
const ringFx = document.createElement('div'); ringFx.style.cssText = `position:absolute;left:${QR.x + QR.s / 2 - 150}px;top:${QR.y + QR.s / 2 - 150}px;width:300px;height:300px;border-radius:50%;border:5px solid #fbeabf;opacity:0;box-shadow:0 0 40px rgba(233,201,130,.9)`;
qrFx.appendChild(brackets); qrFx.appendChild(scanLine); qrFx.appendChild(ringFx);
const scrim = mk(world, 'o', 3600, 3600, 'background:radial-gradient(closest-side,rgba(34,5,15,.55),rgba(34,5,15,.85));');
const heroGlow = mk(world, 'o', 1500, 1500, 'background:radial-gradient(closest-side,rgba(251,234,191,.55),rgba(233,201,130,.18) 50%,rgba(233,201,130,0));');

/* ───────────────────────────── text ───────────────────────────── */
const txtRoot = document.getElementById('txt');
const tblocks = TEXT.map(d => {

  const lk = OM.wordRise(t, LOGO_T, {dist: 40, s0: .88, ds: .12, omega: 14, zeta: .7});
  logoEl.style.opacity = t >= LOGO_T ? lk.op : 0; logoEl.style.transform = `translateY(${lk.y}px) scale(${lk.s})`;
  logoEl.querySelector('.m').style.backgroundPosition = `${mix(0, 100, seg(t, LOGO_T, LOGO_T + 2.6))}% 0`;
  logoEl.querySelector('.o2').style.transform = `scaleX(${clamp(spr(t - LOGO_T - .3, .8, 10), 0, 1.1)})`;
  return true;
}
window.__seek = async t => seek(t);

/* ───────────────────────────── ready: fonts, then every drawing ───────────────────────────── */
window.__ready = (async () => {
  await Promise.all([document.fonts.load('600 40px RK', 'كتاب٠١٢ 9:41'), document.fonts.load('italic 600 40px CG', 'Ms. Memories'), document.fonts.load('500 40px RK', 'كتاب')]);
  await document.fonts.ready;
  drawPhoneBase(window.__phone1Canvas.getContext('2d'), 1.5, gallerySkin);
  drawPhoneBase(p2base.getContext('2d'), 1.5, c => { c.fillStyle = '#12030a'; c.fillRect(0, 0, 400, 860); });
  ART.drawCover(coverFront); ART.drawEndpaper(coverBack); drawFX();
  const q = new URLSearchParams(location.search); if (q.has('t')) seek(parseFloat(q.get('t'))); else seek(0);
  if (q.has('play')) { const t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); }
  return true;
})();
