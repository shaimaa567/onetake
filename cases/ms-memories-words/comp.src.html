function words(t,ws,size,cx,cy,t0,t1,color,stagger=0.09,weight=500){

    ctx.save(); ctx.translate(x,cy+r.y-out*34); ctx.scale(r.s*fit,r.s*fit); ctx.fillText(w,0,0); ctx.restore(); x-=wz[i]*fit/2+sp*fit; });

}

  list.forEach((w,i)=>{ const d=i-p, ad=Math.abs(d); if(ad>1.7) return; const wd=ctx.measureText(w).width, fit=Math.min(1,900/wd);
    ctx.save(); ctx.globalAlpha=a*clamp(1-ad*0.8,0,1)**1.3; ctx.filter=ad>0.12?`blur(${(ad*7*DPR).toFixed(1)}px)`:'none';
    ctx.fillStyle=(i===list.length-1&&ad<0.5)?hot:color; ctx.translate(cx,cy+d*size*1.25-(1-a)*20); ctx.scale(fit*(1-0.1*ad),fit*(1-0.1*ad)); ctx.fillText(w,0,0); ctx.restore(); });
  ctx.restore();
}

const COVERS={main:null};
function cover3D(src,cx,cy,w,h,yaw,roll,persp,alpha=1){

function book3D(cover,spine,pages,cx,cy,w,h,d,yaw,roll,persp,alpha=1){

// the signature is written by a pen: every ink pixel has the time the pen reaches it (logo_t2.png, 16-bit in R,G)
function makeSignature(){ const w=inkImg.naturalWidth,h=inkImg.naturalHeight; const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(inkImg,0,0); const base=g.getImageData(0,0,w,h); const tc=document.createElement('canvas'); tc.width=w; tc.height=h; const tg=tc.getContext('2d',{willReadFrequently:true}); tg.drawImage(tImg,0,0); const td=tg.getImageData(0,0,w,h).data;
  const n=w*h, T=new Float32Array(n), A=new Uint8Array(n); for(let i=0;i<n;i++){ T[i]=(td[i*4]*256+td[i*4+1])/65534; A[i]=base.data[i*4+3]; }
  const out=g.createImageData(w,h); const o=out.data; for(let i=0;i<n;i++){ o[i*4]=251; o[i*4+1]=248; o[i*4+2]=243; }

  if(t>=T.name&&SIG){ const e=ease.sineInOut(seg(t,T.name,T.under-0.05)); drawSignature(e*1.0);

      const L=[0]; for(let i=1;i<UL.length;i++) L.push(L[i-1]+Math.hypot(UL[i][0]-UL[i-1][0],UL[i][1]-UL[i-1][1])); const tot=L[L.length-1]*u;

    ctx.font='500 46px Tajawal'; ctx.direction='rtl'; ctx.textAlign='center'; ctx.fillStyle=BURG; ctx.fillText('اطلب كتابك',0,16); ctx.restore();
    const H0='@msmemo.om', n=Math.floor(clamp((t-17.3)/0.62,0,1)*H0.length); const caret=(t>=17.25&&t<18.2&&Math.floor(t*3)%2===0)||n<H0.length&&t>=17.3;

}
